version: '0'

services:

  app1:
    build: .
    container_name: app1
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE}

  app2:
    build: .
    container_name: app2
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE}

  app3:
    build: .
    container_name: app3
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE}

  db:
    image: postgres
    container_name: postgres-db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: